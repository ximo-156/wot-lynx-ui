<!DOCTYPE html>
<html><head><meta charset="UTF-8"></head><body style="margin:0">
<iframe id="f" src="/components/popup.html" style="width:1280px;height:1600px;border:0"></iframe>
<script>
window.addEventListener('load', () => {
  setTimeout(() => {
    const doc = document.getElementById('f').contentDocument
    const btn = [...doc.querySelectorAll('.wd-button')].find((b) => b.textContent.includes('居中'))
    if (btn) btn.dispatchEvent(new MouseEvent('click', { bubbles: true }))
    setTimeout(() => {
      const btn2 = [...doc.querySelectorAll('.wd-button')].find((b) => b.textContent.includes('圆角弹出'))
      if (btn2) btn2.dispatchEvent(new MouseEvent('click', { bubbles: true }))
    }, 600)
  }, 3500)
})
</script></body></html>
